@switch (variant()) {
  @case ('avatar') {
    <span
      class="block size-12 animate-shimmer rounded-full bg-panel-strong"
      aria-hidden="true"
    ></span>
  }
  @case ('card') {
    <div class="animate-shimmer rounded-card border border-stroke bg-panel p-5" aria-hidden="true">
      <span class="block h-3 w-24 rounded-full bg-panel-strong"></span>
      <span class="mt-5 block h-7 w-2/3 rounded-lg bg-panel-strong"></span>
      <span class="mt-3 block h-3 w-full rounded-full bg-panel-strong"></span>
      <span class="mt-2 block h-3 w-4/5 rounded-full bg-panel-strong"></span>
      <span class="mt-8 block h-11 w-full rounded-ui bg-panel-strong"></span>
    </div>
  }
  @case ('table') {
    <div class="overflow-hidden rounded-card border border-stroke" aria-hidden="true">
      <div class="grid grid-cols-4 gap-4 bg-panel-raised p-4">
        @for (column of [1, 2, 3, 4]; track column) {
          <span class="h-3 animate-shimmer rounded-full bg-panel-strong"></span>
        }
      </div>
      @for (row of [].constructor(rows()); track $index) {
        <div class="grid grid-cols-4 gap-4 border-t border-stroke bg-panel p-4">
          @for (column of [1, 2, 3, 4]; track column) {
            <span class="h-3 animate-shimmer rounded-full bg-panel-strong"></span>
          }
        </div>
      }
    </div>
  }
  @default {
    <span
      class="block h-3 w-full animate-shimmer rounded-full bg-panel-strong"
      aria-hidden="true"
    ></span>
  }
}
