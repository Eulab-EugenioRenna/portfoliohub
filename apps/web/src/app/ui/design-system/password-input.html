<span
  class="flex min-h-11 items-center overflow-hidden rounded-ui border border-stroke bg-panel-raised transition focus-within:border-brand/60 focus-within:ring-3 focus-within:ring-brand/10"
  [class.border-negative]="invalid()"
>
  <input
    class="min-w-0 flex-1 border-0 bg-transparent px-3.5 text-sm text-ink outline-none placeholder:text-ink-muted/70"
    [type]="visible() ? 'text' : 'password'"
    [value]="value()"
    [disabled]="disabled()"
    [placeholder]="placeholder()"
    (input)="update($any($event.target).value)"
    (blur)="onTouched()"
  />
  <button
    class="mr-1 min-h-9 rounded-lg border-0 bg-transparent px-3 text-xs font-bold text-ink-muted transition hover:bg-panel-strong hover:text-ink"
    type="button"
    [attr.aria-label]="visible() ? 'Nascondi password' : 'Mostra password'"
    (click)="visible.update(value => !value)"
  >
    {{ visible() ? 'Nascondi' : 'Mostra' }}
  </button>
</span>
